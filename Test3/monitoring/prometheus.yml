global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    device: '${DEVICE_NAME}'

scrape_configs:
  - job_name: dexter
    static_configs:
      - targets: ['dexter-exporter:8000']
    scrape_interval: 15s

remote_write:
  - url: 'http://3.111.214.115:8428/api/v1/write'
    queue_config:
      capacity: 50000           # ~4h buffer at 15s scrape; queued when offline (GSM mode)
      max_samples_per_send: 5000
      max_shards: 1             # single shard — conserves Pi memory in GSM mode
      min_backoff: 30s          # don't hammer EC2 rapidly when offline
      max_backoff: 300s         # max 5 min between retries
